<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/fonts/lucide.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../data/seed.js"></script>
<script src="../data/cloud-config.js"></script>
    <script src="../assets/js/cloud.js"></script>
    <script src="../assets/js/app.js"></script>
    <style>
        .auth-card {
            padding: 32px 28px;
        }
        .auth-logo-text {
            display: block;
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--gray-900);
            letter-spacing: -0.5px;
        }
        .auth-logo-sub {
            display: block;
            font-size: 0.8rem;
            color: var(--gray-500);
            margin-top: 4px;
        }
        .auth-hint {
            margin-top: 20px;
            border: 1px dashed var(--gray-300);
            border-radius: var(--radius);
            background: var(--gray-50);
            padding: 14px;
            font-size: 0.8rem;
        }
        .auth-hint-title {
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--gray-700);
        }
        .auth-hint div {
            color: var(--gray-600);
            margin-bottom: 4px;
        }
        .auth-hint .btn {
            margin-top: 8px;
        }
        .auth-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <span class="auth-logo-text" id="store-name">LIBRERIA CREATIVO</span>
            <span class="auth-logo-sub" id="store-slogan">Tu próxima aventura comienza aquí</span>
        </div>
        <h2 class="auth-title">Panel Administrativo</h2>
        <p class="auth-subtitle">Ingresa tus credenciales para administrar la tienda</p>

        <form id="admin-login-form">
            <div class="form-group">
                <label class="form-label" for="login-email">Correo Electrónico</label>
                <input type="email" class="form-control" id="login-email" placeholder="tu-correo@ejemplo.com" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="login-password">Contraseña</label>
                <input type="password" class="form-control" id="login-password" placeholder="Tu contraseña" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="login-btn">Iniciar Sesión</button>
        </form>

        <div class="auth-footer">
            <a href="../index.html">← Volver a la tienda</a>
        </div>
    </div>

    <script>
        (function() {
            var config = DB.getConfig();
            var storeName = document.getElementById('store-name');
            var storeSlogan = document.getElementById('store-slogan');
            if (storeName) storeName.textContent = config.storeName;
            if (storeSlogan) storeSlogan.textContent = config.storeSlogan;
            document.title = 'Panel Administrativo - ' + config.storeName;

            if (AdminAuth.isLoggedIn()) {
                window.location.replace('index.html');
                return;
            }

            document.getElementById('admin-login-form').addEventListener('submit', function(e) {
                e.preventDefault();
                var email = document.getElementById('login-email').value.trim();
                var password = document.getElementById('login-password').value;
                if (!email || !password) {
                    Toast.show('Ingresa el correo y la contraseña', 'error');
                    return;
                }
                var btn = document.getElementById('login-btn');
                btn.disabled = true;
                btn.textContent = 'Iniciando sesión...';
                setTimeout(function() {
                    var result = AdminAuth.login(email, password);
                    btn.disabled = false;
                    btn.textContent = 'Iniciar Sesión';
                    if (result.success) {
                        Toast.show('Bienvenido al panel de administración', 'success');
                        window.location.href = 'index.html';
                    } else {
                        Toast.show(result.message || 'Credenciales incorrectas', 'error');
                    }
                }, 600);
            });
        })();
    </script>
</body>
</html>
