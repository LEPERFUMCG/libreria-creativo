<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/fonts/lucide.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../data/seed.js"></script>
<script src="../data/cloud-config.js"></script>
    <script src="../assets/js/cloud.js"></script>
    <script src="../assets/js/app.js"></script>
    <style>
        .auth-container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }
        .input-icon { position: relative; }
        .input-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            width: 16px;
            height: 16px;
            pointer-events: none;
        }
        .input-icon .form-control { padding-left: 42px; }
        .form-row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }
        .checkbox-label { display: flex; align-items: center; gap: 6px; color: var(--gray-600); cursor: pointer; }
        .checkbox-label input { accent-color: var(--primary); width: 16px; height: 16px; }
        .form-link { color: var(--primary); font-weight: 600; }
        .form-link:hover { text-decoration: underline; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 0.875rem; color: var(--gray-500); }
        .auth-footer p { margin: 0; }
        .input-icon + .input-icon { margin-top: 12px; }
        .input-icon .icon-offset { padding-left: 42px !important; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--gray-500); font-size: 0.85rem; margin-bottom: 16px; }
        .back-link i { width: 14px; height: 14px; }
        .back-link:hover { color: var(--primary); }
        .demo-hint {
            background: var(--info-bg);
            border: 1px solid #bfdbfe;
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--gray-600);
        }
        .demo-hint code { background: var(--white); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
        .auth-logo-img {
            height: 48px;
            width: auto;
            margin: 0 auto 8px;
        }
        .auth-logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            display: block;
            margin-bottom: 8px;
        }
        .auth-success-box {
            text-align: center;
            padding: 24px 0;
        }
        .success-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--success-bg);
            color: var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 2rem;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card card">
            <div class="auth-card-body" style="padding:32px 24px;">
                <div id="recover-reset-view">
                    <div class="auth-logo" id="auth-logo"></div>
                    <h2 class="auth-title">Recuperar Contraseña</h2>
                    <p class="auth-subtitle">Ingresa tu correo y te enviaremos instrucciones para restablecer tu contraseña.</p>

                    <form id="recover-form" class="auth-form">
                        <div class="form-group">
                            <label for="recover-email">Correo electrónico</label>
                            <div class="input-icon">
                                <i class="lucide-mail"></i>
                                <input type="email" id="recover-email" class="form-control" placeholder="tu@email.com" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block" id="recover-btn">
                            <i class="lucide-send" style="width:16px;height:16px;"></i> Enviar Instrucciones
                        </button>
                    </form>
                </div>

                <div id="recover-success-view" style="display:none;">
                    <div class="auth-logo" id="auth-logo-2"></div>
                    <div class="auth-success-box">
                        <div class="success-icon">✉</div>
                        <h2 class="auth-title">¡Correo Enviado!</h2>
                        <p class="auth-subtitle">Si existe una cuenta con ese correo, recibirás las instrucciones para recuperar tu contraseña.</p>
                        <a href="login.html" class="btn btn-primary btn-block mt-4">Volver a Iniciar Sesión</a>
                    </div>
                </div>

                <div class="auth-footer">
                    <p>¿Recordaste tu contraseña? <a href="login.html" class="form-link">Inicia sesión</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const config = DB.getConfig();
            ['auth-logo', 'auth-logo-2'].forEach(function(id) {
                const el = document.getElementById(id);
                if (!el) return;
                if (config.logo) {
                    el.innerHTML = `<img src="${config.logo}" alt="${config.storeName || 'Librería'}" class="auth-logo-img">`;
                } else {
                    el.innerHTML = `<span class="auth-logo-text">${config.storeName || 'Librería'}</span>`;
                }
            });

            document.getElementById('recover-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const email = document.getElementById('recover-email').value.trim();
                if (!email) {
                    Toast.show('Por favor ingresa tu correo electrónico.', 'error');
                    return;
                }

                // Demo flow: check if the account exists and "send" the email
                const customers = DB.getCustomers();
                const exists = customers.some(function(c) {
                    return c.email.toLowerCase() === email.toLowerCase();
                });

                const btn = document.getElementById('recover-btn');
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;display:inline-block;"></span> Enviando...';

                setTimeout(function() {
                    document.getElementById('recover-form').style.display = 'none';
                    document.getElementById('recover-reset-view').querySelector('.auth-subtitle').style.display = 'none';
                    document.getElementById('recover-success-view').style.display = 'block';
                    if (exists) {
                        Toast.show('Instrucciones enviadas. Revisa tu correo.', 'success');
                    } else {
                        Toast.show('Revisa tu correo para continuar.', 'info');
                    }
                }, 1200);
            });
        });
    </script>
</body>
</html>
