<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../data/seed.js"></script>
<script src="../data/cloud-config.js"></script>
    <script src="../assets/js/cloud.js"></script>
    <script src="../assets/js/app.js"></script>
</head>
<body>
    <div id="mobile-nav" class="mobile-nav"></div>
    <header class="site-header">
        <div id="header-top" class="header-top"></div>
        <div id="header-main" class="header-main"></div>
    </header>

    <main class="main-content">
        <div class="container">
            <div id="page-content" class="page-content">
                <div class="page-loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initPublicPage();
            loadPageContent();
        });

        function loadPageContent() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('page');

            if (!slug) {
                renderNotFound();
                return;
            }

            const pages = DB.getPages();
            const page = pages.find(p => p.slug === slug);

            if (!page) {
                renderNotFound();
                return;
            }

            document.title = page.title + ' - Libreria';

            document.getElementById('page-content').innerHTML = `
                <div class="page-header">
                    <h1 class="page-title">${page.title}</h1>
                </div>
                <div class="static-page-body">
                    ${page.content}
                </div>
            `;
        }

        function renderNotFound() {
            document.getElementById('page-content').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">
                        <i class="lucide-file-question"></i>
                    </div>
                    <h3>Pagina no encontrada</h3>
                    <p>La pagina que buscas no existe o no esta disponible.</p>
                    <a href="../index.html" class="btn btn-primary">Volver al Inicio</a>
                </div>
            `;
        }
    </script>
</body>
</html>
